# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    doc.content_dir: '%kernel.project_dir%/content/doc'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Liip\ImagineBundle\Imagine\Cache\Resolver\FormatExtensionResolver:
        arguments:
            - '@liip_imagine.cache.resolver.default'
            - '@liip_imagine.filter.configuration'
        tags:
            - { name: liip_imagine.cache.resolver, resolver: format_extension }

    # CommonMark: core syntax + GitHub-Flavored Markdown (tables, ...) + front matter
    League\CommonMark\Extension\CommonMark\CommonMarkCoreExtension: ~
    League\CommonMark\Extension\GithubFlavoredMarkdownExtension: ~
    League\CommonMark\Extension\FrontMatter\FrontMatterExtension: ~

    League\CommonMark\Environment\Environment:
        arguments:
            $config: []
        calls:
            - [addExtension, ['@League\CommonMark\Extension\CommonMark\CommonMarkCoreExtension']]
            - [addExtension, ['@League\CommonMark\Extension\GithubFlavoredMarkdownExtension']]
            - [addExtension, ['@League\CommonMark\Extension\FrontMatter\FrontMatterExtension']]

    League\CommonMark\Parser\MarkdownParserInterface:
        class: League\CommonMark\Parser\MarkdownParser
        arguments: ['@League\CommonMark\Environment\Environment']

    League\CommonMark\Renderer\DocumentRendererInterface:
        class: League\CommonMark\Renderer\HtmlRenderer
        arguments: ['@League\CommonMark\Environment\Environment']

    # Standalone front matter parser: lets DocCatalog read page metadata
    # without converting the Markdown body.
    League\CommonMark\Extension\FrontMatter\FrontMatterParserInterface:
        factory: ['@League\CommonMark\Extension\FrontMatter\FrontMatterExtension', 'getFrontMatterParser']

    App\Service\DocPageRenderer:
        arguments:
            $contentDir: '%doc.content_dir%'

    App\Service\DocCatalog:
        arguments:
            $contentDir: '%doc.content_dir%'
