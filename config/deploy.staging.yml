# Kamal deployment — staging destination (merges over config/deploy.yml)
#
# Run from the monorepo root:
#   set -a && source .env.kamal && set +a && kamal deploy -d staging

service: harmonyui-docs-staging
image: nicolaslps/harmonyui-docs-staging

servers:
    web:
        - <%= ENV.fetch("KAMAL_STAGING_HOST") %>

proxy:
    hosts:
        - staging.harmonyui.org

env:
    clear:
        APP_ENV: test
        APP_DEBUG: "true"
        SERVER_NAME: "staging.harmonyui.org, :80, :443"
